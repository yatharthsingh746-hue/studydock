<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semesters | StudyDock</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition">

<!-- NAVBAR -->
<nav class="sticky top-0 z-50 bg-white dark:bg-gray-800 shadow">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <h1 class="text-xl font-bold text-blue-600">StudyDock</h1>
    <div class="flex items-center gap-4">
      <a href="index.html">Home</a>
      <a href="semesters.html" class="text-blue-500">Semesters</a>
      <a href="about.html">About</a>
      <button id="themeToggle" class="px-3 py-1 rounded bg-gray-200 dark:bg-gray-700">🌙</button>
    </div>
  </div>
</nav>

<!-- CONTENT -->
<section class="max-w-7xl mx-auto px-4 py-16">
  <h2 class="text-3xl font-bold text-center mb-10">Choose Your Semester</h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">

    <a href="sem1.html" class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow hover:scale-105 transition">
      <h3 class="text-xl font-semibold mb-2">Semester 1</h3>
      <p class="text-gray-600 dark:text-gray-300">Papers • Notes • PDFs</p>
    </a>

    <div class="bg-gray-300 dark:bg-gray-700 p-6 rounded-xl opacity-70 text-center">
      <h3 class="text-xl font-semibold">Semester 2</h3>
      <p>Coming Soon</p>
    </div>

    <div class="bg-gray-300 dark:bg-gray-700 p-6 rounded-xl opacity-70 text-center">
      <h3 class="text-xl font-semibold">Semester 3</h3>
      <p>Coming Soon</p>
    </div>

  </div>
</section>

<script>
  const toggle = document.getElementById("themeToggle");
  const html = document.documentElement;
  toggle.onclick = () => {
    html.classList.toggle("dark");
    toggle.textContent = html.classList.contains("dark") ? "☀️" : "🌙";
  };
</script>

</body>
</html>
