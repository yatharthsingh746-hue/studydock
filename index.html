<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Studydock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <!-- CSS File -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">Studydock</div>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="semesters.html">Semesters</a></li>
    </ul>
  </nav>

  <!-- Hero / Header Section -->
  <header class="hero">
    <h1>Welcome to Studydock</h1>
    <p>Download previous year papers, assignments, and lab manuals easily.</p>
  </header>

  <!-- Main Content -->
  <main>

    <!-- Buttons Section -->
<section class="home-buttons">
  <h2>Resources</h2>
  <div class="buttons-container">

    <!-- Previous Year Papers Button -->
    <div class="resource-card">
      <button class="resource-btn" onclick="toggleSemesters()">
        Previous Year Papers
      </button>
      <div id="semester-buttons" class="semester-buttons">
    <button onclick="location.href='sem1.html'">Semester 1</button>
    <button onclick="location.href='sem2.html'">Semester 2</button>
    <button onclick="location.href='sem3.html'">Semester 3</button>
    <button onclick="location.href='sem4.html'">Semester 4</button>
    <button onclick="location.href='sem5.html'">Semester 5</button>
    <button onclick="location.href='sem6.html'">Semester 6</button>
</div>

    </div>

    <!-- Assignments Button -->
    <div class="resource-card">
      <a href="assignments.html" class="resource-btn">Assignments</a>
    </div>

  </div>
</section>

  </main>

  <!-- JS for toggling semester buttons -->
  <script>
    function toggleSemesters() {
      const semDiv = document.getElementById("semester-buttons");
      if (semDiv.style.display === "none") {
        semDiv.style.display = "flex";
      } else {
        semDiv.style.display = "none";
      }
    }
  </script>

</body>
</html>
